<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="sudomake: Melih, pentester, bug bounty hunter and fullstack web developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#00ff66" opacity="0.035"/>
    </pattern>
    <radialGradient id="glow" cx="30%" cy="50%" r="70%">
      <stop offset="0" stop-color="#00ff66" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00ff66" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: "JetBrains Mono", "Fira Code", Consolas, "DejaVu Sans Mono", Menlo, monospace; }
      .dump { fill: #00ff66; opacity: 0.13; font-size: 13px; }
      .prompt { fill: #3a7a52; font-size: 22px; }
      .cmd { fill: #00ff66; font-size: 76px; font-weight: 700; letter-spacing: -2px; }
      .role { fill: #c8ffe0; font-size: 21px; }
      .dim { fill: #3a7a52; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="10" fill="#050801"/>
  <rect width="1200" height="300" rx="10" fill="url(#glow)"/>

  <!-- memory-dump texture on the right -->
  <g class="dump">
    <text x="760" y="40">0x7ffe4a10  47 45 54 20 2f 61 70 69</text>
    <text x="760" y="62">0x7ffe4a18  2f 76 31 2f 75 73 65 72</text>
    <text x="760" y="84">0x7ffe4a20  3f 69 64 3d 31 27 20 4f</text>
    <text x="760" y="106">0x7ffe4a28  52 20 31 3d 31 2d 2d 20</text>
    <text x="760" y="128">0x7ffe4a30  48 54 54 50 2f 31 2e 31</text>
    <text x="760" y="150">0x7ffe4a38  0d 0a 48 6f 73 74 3a 20</text>
    <text x="760" y="172">0x7ffe4a40  73 75 64 6f 6d 61 6b 65</text>
    <text x="760" y="194">0x7ffe4a48  2e 70 72 6f 0d 0a 0d 0a</text>
    <text x="760" y="216">0x7ffe4a50  7b 22 72 6f 6c 65 22 3a</text>
    <text x="760" y="238">0x7ffe4a58  22 61 64 6d 69 6e 22 7d</text>
    <text x="760" y="260">0x7ffe4a60  00 00 00 00 00 00 00 00</text>
  </g>

  <!-- main -->
  <text x="64" y="92" class="prompt">melih@sudomake:~$</text>

  <g filter="url(#bloom)">
    <text x="60" y="172" class="cmd">sudo make<tspan class="cursor">_</tspan></text>
  </g>

  <text x="64" y="222" class="role">pentester <tspan class="dim">/</tspan> bug bounty hunter <tspan class="dim">/</tspan> fullstack web dev</text>
  <text x="64" y="256" class="role dim" style="font-size:16px">[+] exit 0 — build complete, no findings left unreported</text>

  <rect width="1200" height="300" rx="10" fill="url(#scan)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="10" fill="none" stroke="#00ff66" stroke-opacity="0.45"/>
</svg>
